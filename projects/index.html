<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Projects</title>
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <nav class="site-nav">
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/projects/" aria-current="page">Projects</a></li>
      <li><a href="/papers/">Papers</a></li>
      <li><a href="/short-stories/">Short Stories</a></li>
    </ul>
  </nav>
  <main class="page" id="projects">
    <h1 class="page-title">Projects</h1>
    <p class="page-intro">If I make something interesting, I'll put it here. You can find the project on my Github or directly linked below.</p>

    <h2 class="page-title section-title" id="tools">Utilities</h2>
    <div class="accordion-controls" role="group" aria-label="Project accordion controls">
      <button class="accordion-control-btn" type="button" data-accordion-action="toggle-all"><span class="accordion-control-label">Open all</span></button>
    </div>
    <details class="project-accordion">
      <summary class="project-summary"><a class="project-summary-link" href="https://github.com/harshakrishna15/yt-dlp-gui" target="_blank" rel="noreferrer">yt-dlp-gui</a></summary>
      <div class="project-content">
        <div class="project-content-inner">
          <p class="project-description">A clean and simple GUI built with tkinter to use yt-dlp.</p>
        </div>
      </div>
    </details>

    <h2 class="page-title section-title" id="games">Games</h2>
    <p class="page-intro">Games coming soon.</p>
  </main>
  <script src="/assets/js/accordions.js"></script>
  <script>
    (() => {
      if (!window.AccordionUtils) {
        return;
      }

      const accordions = [...document.querySelectorAll(".project-accordion")];
      const toggleButton = document.querySelector('[data-accordion-action="toggle-all"]');
      window.AccordionUtils.initGroup({ accordions, toggleButton });
    })();
  </script>
</body>
</html>
